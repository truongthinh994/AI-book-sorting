<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kiểm dataset · Barcode / Rách / Sờn</title>
<style>
:root{color-scheme:light;background:#f4f2ec;color:#232c29;font:15px 'Segoe UI',sans-serif}body{margin:0}header{padding:24px 3vw 16px;background:#e6e8dc;border-bottom:2px solid #243d33}h1{font:32px Georgia,serif;margin:0 0 10px}p{max-width:1000px;line-height:1.5}nav{position:sticky;top:0;z-index:1;display:flex;flex-wrap:wrap;gap:12px;padding:14px 3vw;background:#f4f2ec;border-bottom:1px solid #b3bdb5}input,select,button{font:inherit;padding:8px;border:1px solid #9aa69d;border-radius:2px;background:white;color:inherit}button{background:#243d33;color:white;cursor:pointer}input:focus,select:focus,button:focus{outline:3px solid #d09129}main{padding:18px 3vw}.group{margin-bottom:30px}.group h2{font:22px Georgia,serif;border-bottom:1px solid #9aa69d;padding-bottom:8px}.images{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}article{background:white;border:1px solid #c5ccc4;padding:10px}article img{width:100%;height:auto;cursor:zoom-in}article label{display:block;margin-top:8px}article input{box-sizing:border-box;width:100%}small{overflow-wrap:anywhere;display:block}summary,details{margin-top:10px}.status{color:#7c3b11}#message{white-space:pre-wrap}dialog{max-width:96vw;max-height:96vh}dialog img{max-width:90vw;max-height:85vh}dialog button{display:block}pre{white-space:pre-wrap}
</style>
<header><h1>Bàn kiểm dữ liệu sách</h1><p>Giữ Barcode, Ripped (rách), Wornout (sờn). Bỏ Notch, Spot, Tag. Ảnh chưa duyệt không được dùng train. Bấm ảnh để xem bbox lớn; mở ảnh gốc để đối chiếu. Thay đổi ở đây chỉ nằm trong trình duyệt: xuất CSV rồi lưu vào bản rà, không ghi đè bản đã khóa.</p><details><summary>Thống kê</summary><pre>__SUMMARY__</pre></details></header>
<nav><label>Tìm ảnh/nhóm <input id="search" type="search"></label><label>Tập <select id="part"><option value="">Tất cả</option><option>train</option><option>val</option><option>test</option><option>quarantine</option><option>unsplit</option></select></label><label>Lớp <select id="class"><option value="">Tất cả</option><option>Barcode</option><option>Ripped</option><option>Wornout</option></select></label><label>Trạng thái <select id="status"><option value="">Tất cả</option><option value="pending">Chưa duyệt</option><option value="approved">Đã duyệt nhãn</option><option value="rejected">Cách ly/nghi vấn</option><option value="negative">Ứng viên âm</option></select></label><button id="export">Xuất CSV rà soát</button><label>Nạp CSV <input id="import" type="file" accept=".csv"></label><button id="sort">Xếp lại theo nhóm</button><span id="count" aria-live="polite"></span></nav>
<main><p id="message" role="status"></p><div id="cards"></div></main><dialog><button id="close">Đóng ảnh</button><img alt="Ảnh có nhãn ở kích thước lớn"></dialog>
<script>
const rows=__DATA__, fields=['image_id','group_id','label_review','negative_review','reason'];
const $=id=>document.getElementById(id), cards=$('cards'), byid=new Map(rows.map(r=>[r.image_id,r]));
function select(options,value,onchange){const s=document.createElement('select');for(const [v,t] of options){const o=document.createElement('option');o.value=v;o.textContent=t;s.append(o)}s.value=value;s.onchange=()=>onchange(s.value);return s}
function draw(){cards.replaceChildren();const buckets=new Map();for(const r of [...rows].sort((a,b)=>(a.group_id||'~').localeCompare(b.group_id||'~'))){const key=r.group_id||'Chưa xác định nhóm';if(!buckets.has(key))buckets.set(key,[]);buckets.get(key).push(r)}for(const [name,rs] of buckets){const group=document.createElement('section');group.className='group';const title=document.createElement('h2');title.textContent=name;const images=document.createElement('div');images.className='images';for(const r of rs){const c=document.createElement('article');c.dataset.id=r.image_id;const img=new Image();img.src='data:image/jpeg;base64,'+r.image;img.alt='BBox '+r.image_id;img.loading='lazy';img.onclick=()=>{document.querySelector('dialog img').src=img.src;document.querySelector('dialog').showModal()};c.append(img);const id=document.createElement('small');id.textContent=r.image_id+' · '+r.part+' · '+r.classes.join(', ');c.append(id);const a=document.createElement('a');a.href=r.raw;a.target='_blank';a.rel='noopener';a.textContent='Mở ảnh gốc';c.append(a);for(const field of ['group_id','reason']){const l=document.createElement('label');l.textContent=field==='group_id'?'Nhóm sách':'Lý do / bằng chứng rà';const input=document.createElement('input');input.value=r[field];input.oninput=()=>{r[field]=input.value;filter()};l.append(input);c.append(l)}const l=document.createElement('label');l.textContent='Nhãn ';l.append(select([['pending','Chờ kiểm'],['approved','Đã rà đủ nhãn'],['rejected','Còn nghi vấn']],r.label_review,v=>{r.label_review=v;filter()}));c.append(l);if(r.negative){const l=document.createElement('label');l.className='status';l.textContent='Ứng viên âm — cần kiểm không có rách/sờn ';l.append(select([['pending','Chờ kiểm âm'],['approved','Đã kiểm âm'],['rejected','Âm nghi vấn']],r.negative_review,v=>{r.negative_review=v;filter()}));c.append(l)}images.append(c)}group.append(title,images);cards.append(group)}filter()}
function filter(){let n=0;const q=$('search').value.toLowerCase();for(const c of cards.querySelectorAll('article')){const r=byid.get(c.dataset.id),s=$('status').value;const show=(!q||(r.image_id+' '+r.group_id).toLowerCase().includes(q))&&(!$('part').value||r.part===$('part').value)&&(!$('class').value||r.classes.includes($('class').value))&&(!s||(s==='negative'?r.negative:r.label_review===s));c.hidden=!show;if(show)n++}for(const g of cards.children)g.hidden=![...g.querySelectorAll('article')].some(c=>!c.hidden);$('count').textContent=n+' / '+rows.length+' ảnh';const parts=new Map();for(const r of rows){if(!r.group_id||['unsplit','quarantine'].includes(r.part))continue;if(!parts.has(r.group_id))parts.set(r.group_id,new Set());parts.get(r.group_id).add(r.part)}$('message').textContent=[...parts].filter(([g,p])=>p.size>1).map(([g])=>'CẢNH BÁO: nhóm giao nhiều tập: '+g).join('\n')}
for(const id of ['search','part','class','status'])$(id).addEventListener('input',filter);
$('sort').onclick=draw;$('close').onclick=()=>document.querySelector('dialog').close();
const quote=s=>'"'+String(s).replaceAll('"','""')+'"';
$('export').onclick=()=>{const text=[fields.join(','),...rows.map(r=>fields.map(f=>quote(r[f])).join(','))].join('\r\n')+'\r\n';const url=URL.createObjectURL(new Blob(['\uFEFF'+text],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='review.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
function parseCSV(text){let result=[],row=[],field='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){field+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(field);field=''}else if((c==='\r'||c==='\n')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);result.push(row);row=[];field=''}else field+=c}if(quoted)throw Error('CSV thiếu dấu đóng nháy');if(field||row.length){row.push(field);result.push(row)}return result}
$('import').onchange=async e=>{try{if(!e.target.files.length)return;const parsed=parseCSV((await e.target.files[0].text()).replace(/^\uFEFF/,''));if(parsed.shift().join(',')!==fields.join(','))throw Error('Sai cột CSV');const seen=new Set();for(const line of parsed){if(line.length!==5||!byid.has(line[0])||seen.has(line[0])||!['pending','approved','rejected'].includes(line[2])||!['pending','approved','rejected','not_needed'].includes(line[3]))throw Error('CSV có dòng sai hoặc trùng');seen.add(line[0])}if(seen.size!==rows.length)throw Error('CSV thiếu ảnh');for(const line of parsed)fields.forEach((f,i)=>byid.get(line[0])[f]=line[i]);draw()}catch(error){$('message').textContent=error.message}};
draw();
</script></html>
