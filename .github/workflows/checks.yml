name: Repository checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            vision/opencv/requirements.txt
            vision/yolo/requirements-review.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -r vision/yolo/requirements-review.txt
      - run: python scripts/check_repository.py
      - run: python -m unittest discover -s tests -v
